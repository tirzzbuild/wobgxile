<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER PAYMENT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#03000b;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%,#00ffff33,transparent 30%),
      radial-gradient(circle at 80% 80%,#a000ff44,transparent 30%);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(#00ffff15 1px,transparent 1px),
      linear-gradient(90deg,#00ffff15 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:bottom;
    animation:gridMove 5s linear infinite;
    z-index:-1;
}

@keyframes gridMove{
    to{background-position:0 50px;}
}

/* OPENING */
#opening{
    position:fixed;
    inset:0;
    background:#020006;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
    transition:1s;
}

.opening-box{
    animation:zoom 2s infinite alternate;
}

.opening-title{
    font-size:55px;
    font-weight:bold;
    letter-spacing:8px;
    color:#fff;
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px #00ffff,
      0 0 60px #a000ff;
}

.opening-sub{
    color:#00ffff;
    letter-spacing:5px;
    margin-top:15px;
}

.enter{
    margin-top:35px;
    padding:15px 45px;
    border:2px solid #00ffff;
    border-radius:30px;
    background:#00ffff11;
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px #00ffff;
    transition:.3s;
}

.enter:hover{
    background:#00ffff;
    color:#000;
    transform:scale(1.1);
}

@keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.04)}
}

/* MAIN */
#main{
    display:none;
    padding:30px 15px 100px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    text-align:center;
    margin:20px 0 40px;
}

.header h1{
    font-size:45px;
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px #a000ff;
}

.header p{
    color:#aaa;
    margin-top:10px;
}

/* PAYMENT GRID */
.payment-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
}

/* 3D CARD */
.card{
    min-height:240px;
    padding:25px;
    position:relative;
    border-radius:25px;
    background:linear-gradient(
        145deg,
        rgba(0,255,255,.12),
        rgba(160,0,255,.12)
    );
    border:1px solid #00ffff66;
    backdrop-filter:blur(15px);
    transform-style:preserve-3d;
    transition:.15s;
    box-shadow:
      0 15px 40px #000,
      inset 0 0 30px #00ffff0d;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    background:#00ffff;
    filter:blur(80px);
    opacity:.2;
    right:-50px;
    top:-50px;
}

.card:hover{
    box-shadow:
      0 0 25px #00ffff66,
      0 0 50px #a000ff44;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
    transform:translateZ(40px);
}

.card h2{
    transform:translateZ(30px);
}

.card p{
    color:#aaa;
    margin-top:8px;
}

.number{
    color:#00ffff;
    font-size:19px;
    margin:18px 0;
    transform:translateZ(25px);
}

.btn{
    padding:11px 22px;
    border-radius:25px;
    background:linear-gradient(90deg,#00ffff,#8a00ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #00ffff66;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #00ffff;
}

/* QRIS */
#qrPopup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:#000b;
    z-index:5000;
    padding:20px;
}

.qr-box{
    background:#090012;
    border:1px solid #00ffff;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:
      0 0 30px #00ffff,
      0 0 70px #8a00ff;
}

.qr-box img{
    width:230px;
    max-width:100%;
    border-radius:15px;
    margin:20px 0;
}

.close{
    background:#ff0066;
    padding:10px 25px;
    border-radius:20px;
    color:white;
}

/* MUSIC */
.music{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    border:1px solid #00ffff;
    background:#080014;
    color:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 25px #00ffff;
    z-index:3000;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:4px;
    height:4px;
    background:#00ffff;
    border-radius:50%;
    box-shadow:0 0 10px #00ffff;
    pointer-events:none;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    20%{opacity:1}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

@media(max-width:600px){
    .opening-title{
        font-size:35px;
    }

    .header h1{
        font-size:30px;
    }

    .card{
        min-height:220px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<!-- OPENING -->
<div id="opening">
    <div class="opening-box">
        <div class="opening-title">CYBER PAY</div>
        <div class="opening-sub">SECURE PAYMENT SYSTEM</div>

        <button class="enter" onclick="enterSite()">
            ENTER SYSTEM
        </button>
    </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- MAIN -->
<div id="main">

<div class="container">

<div class="header">
    <h1>⚡ CYBER PAYMENT</h1>
    <p>Choose your payment method</p>
</div>

<div class="payment-grid">

<!-- DANA -->
<div class="card">
    <div class="icon">💙</div>
    <h2>DANA</h2>
    <p>Digital Payment</p>

    <div class="number">081234567890</div>

    <button class="btn"
    onclick="copyText('081234567890')">
        COPY NUMBER
    </button>
</div>

<!-- GOPAY -->
<div class="card">
    <div class="icon">💚</div>
    <h2>GOPAY</h2>
    <p>Digital Payment</p>

    <div class="number">081234567890</div>

    <button class="btn"
    onclick="copyText('081234567890')">
        COPY NUMBER
    </button>
</div>

<!-- OVO -->
<div class="card">
    <div class="icon">💜</div>
    <h2>OVO</h2>
    <p>Digital Payment</p>

    <div class="number">081234567890</div>

    <button class="btn"
    onclick="copyText('081234567890')">
        COPY NUMBER
    </button>
</div>

<!-- QRIS -->
<div class="card">
    <div class="icon">📱</div>
    <h2>QRIS</h2>
    <p>Scan QR untuk pembayaran.</p>

    <br>

    <button class="btn" onclick="openQR()">
        SHOW QRIS
    </button>
</div>

</div>
</div>
</div>

<!-- QR POPUP -->
<div id="qrPopup">
    <div class="qr-box">

        <h2>SCAN QRIS</h2>

        <!-- GANTI qris.png DENGAN QRIS KAMU -->
        <img src="qris.png" alt="QRIS">

        <br>

        <button class="btn close" onclick="closeQR()">
            CLOSE
        </button>

    </div>
</div>

<!-- MUSIC BUTTON -->
<button class="music" onclick="musicToggle()" id="musicBtn">
    🔊
</button>

<script>

/* ENTER */
function enterSite(){

    const opening =
        document.getElementById("opening");

    const main =
        document.getElementById("main");

    const music =
        document.getElementById("music");

    opening.style.opacity="0";

    setTimeout(()=>{

        opening.style.display="none";
        main.style.display="block";

        music.play().catch(()=>{});

    },1000);
}


/* COPY */
function copyText(text){

    navigator.clipboard.writeText(text);

    alert("Nomor berhasil disalin!");
}


/* MUSIC */
function musicToggle(){

    const music =
        document.getElementById("music");

    const button =
        document.getElementById("musicBtn");

    if(music.paused){

        music.play();
        button.innerHTML="🔊";

    }else{

        music.pause();
        button.innerHTML="🔇";

    }
}


/* QR */
function openQR(){

    document.getElementById("qrPopup")
    .style.display="flex";

}

function closeQR(){

    document.getElementById("qrPopup")
    .style.display="none";

}


/* 3D MOUSE EFFECT */
document.querySelectorAll(".card").forEach(card=>{

    card.addEventListener("mousemove",(e)=>{

        const rect =
            card.getBoundingClientRect();

        const x =
            e.clientX - rect.left;

        const y =
            e.clientY - rect.top;

        const rotateX =
            ((y / rect.height)-.5)*-12;

        const rotateY =
            ((x / rect.width)-.5)*12;

        card.style.transform =
            `perspective(700px)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)
             scale(1.03)`;

    });

    card.addEventListener("mouseleave",()=>{

        card.style.transform =
            "perspective(700px) rotateX(0) rotateY(0) scale(1)";

    });

});


/* PARTICLES */
for(let i=0;i<50;i++){

    const p =
        document.createElement("div");

    p.className="particle";

    p.style.left =
        Math.random()*100+"%";

    p.style.animationDuration =
        (4+Math.random()*8)+"s";

    p.style.animationDelay =
        Math.random()*8+"s";

    document.body.appendChild(p);
}

</script>

</body>
</html>
